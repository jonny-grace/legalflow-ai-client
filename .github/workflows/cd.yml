name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  verify:
    name: Verify Production Deployment
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Wait for Vercel deployment
        run: |
          echo "Waiting 30 seconds for Vercel to deploy..."
          sleep 30

      - name: Smoke test production frontend
        run: |
          echo "Testing production frontend..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://legalflow-ai.vercel.app)

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Frontend health check passed (HTTP $RESPONSE)"
          else
            echo "⚠️  Frontend returned HTTP $RESPONSE"
          fi

      - name: Smoke test production API
        run: |
          echo "Testing production API..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            https://legalflow-api.onrender.com/api/health)

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ API health check passed (HTTP $RESPONSE)"
          else
            echo "❌ API health check failed (HTTP $RESPONSE)"
            exit 1
          fi
